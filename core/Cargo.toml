[package]
name = "traintime-core"
version = "0.1.0"
edition = "2021"
authors = ["Evan Thomas <evan@evanjt.com>"]
description = "Runtime-agnostic types and parsers shared by the Cloudflare Worker and the native server"
publish = false

# Own workspace root. Do not remove. Without this, declaring a workspace at the
# repo root would pull this crate in as a member, and `worker-build --release`
# would try to compile the native server's deps for wasm32.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
