name = "traintime-monitor"
main = "src/index.js"
compatibility_date = "2026-03-14"
workers_dev = false
preview_urls = false

# Every five minutes, 288 runs a day against the account's 100k free invocations.
[triggers]
# Paused: ntfy.sh rejects pushes from Cloudflare's shared IPs (429, daily quota per IP).
# The cluster watchdog is the monitor. Re-enable only with a delivery path that works.
crons = []

# One key per host holding ok/down and when it changed, so a push only goes out
# on a transition. Create with: wrangler kv namespace create STATE
[[kv_namespaces]]
binding = "STATE"
id = "0ca1bcbfaf6548f3861ab1b7005a78db"

# Secrets set with `wrangler secret put`: NTFY_TOPIC, API_KEY, optionally NTFY_TOKEN.

[observability]
enabled = false
