name = "traintime-api"
main = "build/index.js"
compatibility_date = "2026-03-14"
workers_dev = false
preview_urls = false

# api2 is a stable alias for this same Worker, so api.traintime.ch can later be
# repointed (at the cluster, at a rollback) without losing a way to reach it.
[[routes]]
pattern = "api.traintime.ch"
custom_domain = true

[[routes]]
pattern = "api2.traintime.ch"
custom_domain = true

# Places the Worker near the OJP backend. That backend resolves to a Tyk gateway
# on AWS eu-central-1 (Frankfurt), not Switzerland. Mirrors the dashboard setting.
[placement]
mode = "targeted"
hostname = "api.opentransportdata.swiss"

[build]
command = "export PATH=\"$HOME/.cargo/bin:$PATH\" && command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y -q 2>/dev/null && export PATH=\"$HOME/.cargo/bin:$PATH\" && rustup target add wasm32-unknown-unknown 2>/dev/null && cargo install -q \"worker-build@^0.7\" && worker-build --release"

[vars]
DEPARTURE_CACHE_TTL = "60"

[[kv_namespaces]]
binding = "CACHE"
id = "0da949fc58a5490080810f64eea0960f"

[[d1_databases]]
binding = "DB"
database_name = "traintime-stations"
database_id = "6f77d13d-6731-4b46-b0f7-177a7eeb6aa1"

[observability]
enabled = false