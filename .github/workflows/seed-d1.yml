name: Seed D1

# D1 is synced from main so it never holds data the repo doesn't.
on:
  push:
    branches:
      - main
    paths:
      - 'data/stations.json'
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seed D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/seed_d1.sh
